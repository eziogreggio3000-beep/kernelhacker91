<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>KERNEL HACKER '91</title>
<link href="https://fonts.googleapis.com/css2?family=VT323&family=IBM+Plex+Sans:wght@400;600&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--fg:#33ff66;--dim:#1c7a36;--bg:#031006;--warn:#ffd040;--err:#ff5050}
body.amber{--fg:#ffb000;--dim:#7a5400;--bg:#0c0700}
body.dos{--fg:#c8c8c8;--dim:#6a6a6a;--bg:#050505}
body.dos #crt{text-shadow:0 0 2px rgba(200,200,200,.5)}
body.cyan{--fg:#40e0ff;--dim:#1a6478;--bg:#00090c}
body.white{--fg:#e6e6e6;--dim:#6a6a6a;--bg:#0b0b0b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#000}
body{font-family:'VT323',ui-monospace,Menlo,monospace;color:var(--fg);font-size:22px;line-height:1.1;overflow:hidden;user-select:none;-webkit-user-select:none}
button,input{font:inherit;color:inherit}
#crt{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;text-shadow:0 0 5px color-mix(in srgb,var(--fg) 70%,transparent);max-width:900px;margin:0 auto;overflow:hidden}
#crt::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:90;background:repeating-linear-gradient(0deg,rgba(0,0,0,.28) 0 1px,transparent 1px 3px),radial-gradient(ellipse at center,transparent 60%,rgba(0,0,0,.55) 100%);animation:flick 4s infinite}
@keyframes flick{0%,100%{opacity:1}50%{opacity:.93}}
header{padding:8px 10px 6px;border-bottom:2px solid var(--fg)}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.sp{flex:1}
#osname{font-size:28px;letter-spacing:1px}
.stats{font-size:20px;margin-top:2px;gap:4px 14px}
.stats b{font-weight:normal;color:var(--fg)}
.warn{color:var(--warn)!important}.err{color:var(--err)!important}.dim{color:var(--dim)}
.mini{background:none;border:none;padding:2px 0;cursor:pointer}
main{flex:1;position:relative;min-height:0}
.pane{position:absolute;inset:0;overflow-y:auto;padding:10px;display:none}
.pane.on{display:flex;flex-direction:column}
#p-code{gap:7px}
#bugs{flex-shrink:0}
#codewrap{flex:1;min-height:130px;border:1px solid var(--dim);position:relative;overflow:hidden;cursor:text;touch-action:manipulation}
#code{margin:0;padding:6px 8px;font:inherit;font-size:19px;white-space:pre-wrap;word-break:break-all;position:absolute;left:0;right:0;bottom:0;top:auto;overflow:visible}
#code::after{content:"█";animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
#hint{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:20px;font-size:24px;animation:blink 1.2s steps(1) infinite;pointer-events:none}
.float{position:absolute;pointer-events:none;font-size:22px;animation:up .8s ease-out forwards;z-index:5}
@keyframes up{to{transform:translateY(-50px);opacity:0}}
#bugs{display:flex;flex-direction:column;gap:4px}
.bug{background:color-mix(in srgb,var(--err) 14%,transparent);border:1px solid var(--err);color:var(--err);text-shadow:0 0 5px var(--err);text-align:left;padding:4px 8px;cursor:pointer;animation:shake .3s}
@keyframes shake{25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}
#log{max-height:22%;min-height:50px;flex-shrink:0;overflow-y:auto;font-size:19px;white-space:pre-wrap;border-top:1px dashed var(--dim);padding-top:4px}
#srow{display:flex;gap:8px;align-items:center}
#sprintb{flex:1;background:none;border:1px solid var(--fg);padding:6px 8px;cursor:pointer;text-align:left}
#sprintb.ready{background:var(--fg);color:var(--bg);text-shadow:none;animation:pulse2 1.4s infinite}
#sprintb.wait{border-color:var(--dim);color:var(--dim);text-shadow:none}
#sprintb.run{border-color:var(--warn);color:var(--warn)}
@keyframes pulse2{50%{opacity:.75}}
#combo{min-width:5.5em;text-align:right;color:var(--warn)}
#crt.sprint header{border-bottom-color:var(--warn);animation:sflash .5s steps(1) infinite}
@keyframes sflash{50%{border-bottom-color:transparent}}
#tix{display:flex;flex-direction:column;gap:4px;flex-shrink:0}
.tk{display:flex;justify-content:space-between;gap:8px;width:100%;text-align:left;border:1px solid var(--dim);padding:3px 8px;font-size:19px;cursor:pointer;background:linear-gradient(90deg,color-mix(in srgb,var(--fg) 20%,transparent) var(--p),transparent var(--p))}
.tk.done{border-color:var(--fg);background:var(--fg);color:var(--bg);text-shadow:none;animation:pulse2 1s infinite}
.tk span:last-child{white-space:nowrap}
#shellf{display:flex;flex-shrink:0;gap:6px;align-items:center;border:1px solid var(--fg);padding:2px 8px}
#shellf[hidden]{display:none}
#shell{flex:1;background:none;border:none;outline:none;caret-color:var(--fg);user-select:text;-webkit-user-select:text;text-shadow:inherit}
h3{margin:12px 0 6px;font-weight:normal;font-size:22px;border-bottom:1px solid var(--dim)}
h3:first-child{margin-top:0}
.item{display:block;width:100%;text-align:left;background:none;border:1px solid var(--dim);padding:6px 9px;margin-bottom:7px;cursor:pointer}
.item .t{display:flex;justify-content:space-between;gap:10px}
.item .d{font-size:18px;opacity:.85}
.item.buy{border-color:var(--fg);background:color-mix(in srgb,var(--fg) 13%,transparent)}
.item.poor{opacity:.75}
.item.lock,.item.ram{color:var(--dim);text-shadow:none}
.item.ok{border-style:dashed;cursor:default;opacity:.65}
.item.inst{border-style:dashed}
.item.rel.buy{animation:pulse 1s infinite}
@keyframes pulse{50%{background:color-mix(in srgb,var(--fg) 35%,transparent)}}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btn{background:none;border:1px solid var(--fg);padding:5px 12px;cursor:pointer}
.btn.sel{background:var(--fg);color:var(--bg);text-shadow:none}
nav{display:flex;border-top:2px solid var(--fg)}
nav button{flex:1;background:none;border:none;border-right:1px solid var(--dim);padding:10px 2px;cursor:pointer;font-size:21px;position:relative}
nav button:last-child{border-right:none}
nav button.on{background:var(--fg);color:var(--bg);text-shadow:none}
nav button .dot{position:absolute;top:4px;right:6px;width:8px;height:8px;background:var(--warn);display:none}
nav button.new .dot{display:block}
.ov{position:absolute;inset:0;z-index:60;background:var(--bg);padding:14px;overflow-y:auto}
.ov[hidden]{display:none}
#boot pre,#endlog{margin:0;font:inherit;white-space:pre-wrap}
#nameform{margin-top:10px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
#nameform[hidden]{display:none}
#nameinp{background:none;border:1px solid var(--fg);padding:4px 8px;width:12ch;text-transform:uppercase;outline:none;user-select:text;-webkit-user-select:text}
#panic{background:#0010a0;color:#fff;text-shadow:0 0 4px #9cf;cursor:pointer}
#panic pre{font:inherit;white-space:pre-wrap;margin:0}
.desk{position:absolute;inset:0;display:flex;flex-direction:column;background:repeating-linear-gradient(45deg,var(--bg) 0 6px,color-mix(in srgb,var(--fg) 7%,var(--bg)) 6px 8px)}
.dbar{background:var(--fg);color:var(--bg);text-shadow:none;padding:4px 10px;display:flex;justify-content:space-between}
.icons{display:flex;gap:16px;padding:12px;flex-wrap:wrap}
.ico{text-align:center;width:86px;font-size:17px;overflow:hidden;text-overflow:ellipsis}
.ico i{display:block;width:44px;height:36px;margin:0 auto 4px;border:2px solid var(--fg);font-style:normal;line-height:32px;font-size:20px}
.win{margin:auto 12px;border:2px solid var(--fg);background:var(--bg);box-shadow:6px 6px 0 color-mix(in srgb,var(--fg) 30%,transparent);max-width:560px;align-self:center;width:calc(100% - 24px)}
.win .tb{background:var(--fg);color:var(--bg);text-shadow:none;padding:2px 8px;display:flex;justify-content:space-between}
.win .bd{padding:10px 12px;font-size:20px}
.big{font-size:44px;text-align:center;letter-spacing:3px;margin:6px 0 10px}

.dlg .tb{display:none}
#pause:not([hidden]),#evo:not([hidden]),#sres:not([hidden]),#end:not([hidden]),#cards:not([hidden]),#mg:not([hidden]),#usn:not([hidden]){display:flex}
.ov>.dlg{margin:auto}
.dlg{max-width:92%;min-width:260px}
.dlg .bd{padding:4px}
.splash{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:var(--desk);color:#fff;font-family:Tahoma,Arial,sans-serif;text-align:center}
.splash .sn{font-size:42px;font-weight:bold;font-style:italic;text-shadow:3px 3px 0 #000}
.splash .pb{width:220px;height:16px;border:2px solid;border-color:#404040 #fff #fff #404040;background:#fff}
.splash .pb i{display:block;height:100%;width:0;background:#000080;animation:fill 1.6s linear forwards}
@keyframes fill{to{width:100%}}
/* ===== EPOCHE GRAFICHE ===== */
body.gui{--fg:#000;--dim:#808080;--bg:#c0c0c0;--warn:#8a4b00;--err:#c00000;--face:#c0c0c0;font-family:Tahoma,Verdana,'Segoe UI',sans-serif;font-size:15px;line-height:1.25}
body.e1{--desk:#a0a0a0;--title:#000080;--task:#c0c0c0;font-family:Arial,Helvetica,sans-serif}
body.e2{--desk:#008080;--title:#000080;--task:#c0c0c0}
body.e3{--desk:#3a6ea5;--title:linear-gradient(90deg,#000080,#1084d0);--task:#c0c0c0}
body.e4{--desk:linear-gradient(180deg,#2f6fd6,#8fbcf2);--title:linear-gradient(180deg,#0a5fe0,#3d95ff 45%,#0a5fe0);--task:linear-gradient(180deg,#3a7cf0,#245edb 15%,#1f52c9);--face:#ece9d8;--bg:#ece9d8}
body.gui #crt{background:var(--desk);text-shadow:none}
body.e1 #crt{background:#a0a0a0 repeating-conic-gradient(#a8a8a8 0 25%,#989898 0 50%) 0 0/4px 4px}
body.gui #crt::after{display:none}
body.gui header{margin:6px 6px 0;padding:0;border:2px solid;border-color:#fff #404040 #404040 #fff;background:var(--face)}
body.gui header .row:first-child{background:var(--title);color:#fff;padding:3px 6px;font-weight:bold}
body.gui #osname{font-size:16px;letter-spacing:0}
body.gui #ver{color:#dde}
body.gui .hbtns button{background:var(--face);color:#000;border:2px solid;border-color:#fff #404040 #404040 #fff;padding:0 5px;font-size:12px;font-weight:normal}
body.gui .stats{padding:3px 6px;font-size:13px}
body.gui main{margin:0 6px 6px;background:var(--face);border:2px solid;border-top:none;border-color:#fff #404040 #404040 #fff}
body.gui .pane{padding:8px}
body.gui h3{font-size:14px;font-weight:bold;border-bottom:1px solid #808080;box-shadow:0 1px 0 #fff;margin-bottom:8px}
body.gui .item,body.gui .btn,body.gui #sprintb,body.gui .tk{background:var(--face);border:2px solid;border-color:#fff #404040 #404040 #fff;color:#000;text-shadow:none}
body.gui .item:active,body.gui .btn:active,body.gui #sprintb:active{border-color:#404040 #fff #fff #404040}
body.gui .item{padding:5px 8px}
body.gui .item .t{font-weight:bold;font-size:14px}
body.gui .item .d{font-size:12px}
body.gui .item.buy{background:#ffffe1}
body.gui .item.lock,body.gui .item.ram{color:#808080;text-shadow:1px 1px 0 #fff}
body.gui .item.rel.buy{animation:pulse2 1s infinite;background:#ffff80}
body.gui .btn.sel{background:var(--face);color:#000;font-weight:bold;outline:1px dotted #000;outline-offset:-5px}
body.gui #codewrap{background:#fff;border:2px solid;border-color:#808080 #fff #fff #808080}
body.gui #code{font-family:'Courier New',monospace;font-size:13px;color:#000}
body.gui #code::after{content:"|"}
body.gui #hint{font-size:16px;color:#000080;font-weight:bold}
body.gui .float{color:#000080;font-weight:bold;font-size:16px}
body.gui #sprintb{font-size:14px}
body.gui #sprintb.ready{color:#000080;font-weight:bold}
body.gui #sprintb.wait{color:#808080;text-shadow:1px 1px 0 #fff;animation:none}
body.gui #sprintb.run{color:#c00000;font-weight:bold}
body.gui #combo{color:#c00000;font-weight:bold;font-size:14px}
body.gui .tk{font-size:13px;background:linear-gradient(90deg,#a8e0a8 var(--p),var(--face) var(--p))}
body.gui .tk.done{background:#000080;color:#fff;font-weight:bold}
body.gui .bug{background:#fff;border:2px solid #c00000;color:#c00000;text-shadow:none;font-size:13px}
body.gui #log{background:#fff;border:2px solid;border-color:#808080 #fff #fff #808080;padding:3px 5px;font-size:12px}
body.gui #shellf{background:#000;color:#c0c0c0;border:2px solid;border-color:#808080 #fff #fff #808080;font-family:'Courier New',monospace;font-size:13px}
body.gui #shell{color:#c0c0c0}
body.gui nav{border-top:2px solid #fff;background:var(--task);padding:3px;gap:3px}
body.gui nav button{border:2px solid;border-color:#fff #404040 #404040 #fff;background:var(--face);font-size:13px;padding:7px 2px;color:#000}
body.gui nav button.on{border-color:#404040 #fff #fff #404040;background:repeating-conic-gradient(#c0c0c0 0 25%,#fff 0 50%) 0 0/2px 2px;color:#000;font-weight:bold}
body.gui nav button .dot{background:#c00000}
body.e1 nav{background:#c0c0c0}
body.e2 nav::before,body.e3 nav::before{content:"▶ Avvio";display:flex;align-items:center;padding:0 8px;font-weight:bold;font-size:13px;border:2px solid;border-color:#fff #404040 #404040 #fff;background:var(--face)}
body.e4 header{border:none;border-radius:8px 8px 0 0;overflow:hidden;background:var(--title)}
body.e4 header .row:first-child{padding:6px 8px;text-shadow:1px 1px #0a3080}
body.e4 .stats{background:var(--face);border-left:3px solid #0a5fe0;border-right:3px solid #0a5fe0}
body.e4 main{border:3px solid #0a5fe0;border-top:none}
body.e4 .item,body.e4 .btn,body.e4 #sprintb,body.e4 .hbtns button{border:1px solid #003c74;border-radius:3px;background:linear-gradient(#fff,#e3e0d0)}
body.e4 .tk{border:1px solid #003c74;border-radius:3px}
body.e4 .item.buy{background:linear-gradient(#fffbe0,#f3e6a0)}
body.e4 .tk.done{background:linear-gradient(#3d95ff,#0a5fe0)}
body.e4 nav{background:var(--task);border-top:1px solid #6fa3f7}
body.e4 nav::before{content:"avvio";display:flex;align-items:center;padding:0 16px 0 12px;margin:-3px 4px -3px -3px;font-weight:bold;font-style:italic;font-size:16px;color:#fff;text-shadow:1px 1px #1a5a10;background:linear-gradient(#5fc24d,#329a24);border-radius:0 14px 14px 0}
body.e4 nav button{background:linear-gradient(#5a9af7,#3c82ec);border:1px solid #1d4fbf;border-radius:3px;color:#fff}
body.e4 nav button.on{background:linear-gradient(#1e4fc0,#2a64d8);color:#fff;border-color:#0d3a9a}
body.gui #boot{background:#000;color:#c0c0c0;font-family:'Courier New',monospace;font-size:15px}
body.gui #panic{font-family:'Courier New',monospace;font-size:15px}
body.gui #pause,body.gui #sres,body.gui #evo,body.gui #end,body.gui #cards,body.gui #mg,body.gui #usn{background:rgba(0,0,0,.3)}
body.gui .dlg{background:var(--face);border:2px solid;border-color:#fff #404040 #404040 #fff;box-shadow:3px 3px 0 rgba(0,0,0,.5)}
body.gui .dlg .tb{display:block;background:var(--title);color:#fff;font-weight:bold;padding:3px 6px}
body.gui .dlg .bd{padding:12px}
body.gui .dlg pre{font-family:'Courier New',monospace!important;font-size:14px}
body.e4 .dlg{border:3px solid #0a5fe0;border-radius:8px 8px 0 0}
body.gui .desk{background:var(--desk)}
body.gui .dbar{order:3;background:var(--task);color:#000;border-top:2px solid #fff}
body.e4 .dbar{color:#fff}
body.gui .ico{color:#fff;text-shadow:1px 1px #000}
body.gui .ico i{border-color:#fff;background:rgba(255,255,255,.2)}
body.gui .win{background:var(--face);border:2px solid;border-color:#fff #404040 #404040 #fff;box-shadow:3px 3px 0 rgba(0,0,0,.5)}
body.e4 .win{border:3px solid #0a5fe0;border-radius:8px 8px 0 0}
body.gui .win .tb{background:var(--title);color:#fff;font-weight:bold}
body.gui .win .bd{font-size:14px}
body.gui .big{font-size:32px;font-weight:bold;color:#000080;letter-spacing:0}

.card{display:flex;flex-direction:column;gap:2px;width:100%;text-align:left;background:none;border:2px solid var(--dim);padding:8px 10px;margin-bottom:8px;cursor:pointer;color:inherit;font:inherit}
.card .rar{font-size:.75em;letter-spacing:2px;opacity:.85}
.card b{font-size:1.15em}
.card.r1{border-color:var(--warn)}.card.r1 .rar{color:var(--warn)}
.card.r2{border-color:var(--err);animation:pulse 1.2s infinite}.card.r2 .rar{color:var(--err)}
body.gui .card{background:var(--face);border:2px solid;border-color:#fff #404040 #404040 #fff;color:#000;font-size:14px}
body.gui .card.r1 .rar{color:#0050c0}
body.gui .card.r2{background:#fff4c0}
body.gui .card.r2 .rar{color:#a000a0}
#chart{display:block;width:100%;height:110px;border-left:1px solid currentColor;border-bottom:1px solid currentColor;margin:4px 0}
body.gui #chart{color:#000080}
.stars{font-size:28px;text-align:center;color:var(--warn);min-height:34px;margin-top:6px}
body.gui .stars{color:#c08000}
.rev{margin:5px 0;font-size:.9em}.rev b{display:block;font-weight:normal;opacity:.8}
body.gui .rev b{font-weight:bold}
.launch{width:520px}

.mgbar{height:10px;border:1px solid currentColor;margin:4px 0 10px}
.mgbar i{display:block;height:100%;background:var(--fg);width:100%}
body.gui .mgbar i{background:#000080}
.mgl{display:block;width:100%;text-align:left;font-family:'Courier New',monospace;font-size:15px;background:none;border:1px solid var(--dim);color:inherit;padding:7px 8px;margin-bottom:6px;cursor:pointer}
body.gui .mgl{background:#fff;border:2px solid;border-color:#808080 #fff #fff #808080;color:#000}
.mgl.ok{border-color:var(--fg);background:color-mix(in srgb,var(--fg) 25%,transparent)}
.mgl.no{border-color:var(--err);color:var(--err)}
.mgarea{position:relative;height:180px;border:1px dashed var(--dim);overflow:hidden;touch-action:manipulation}
body.gui .mgarea{background:#fff}
.mgt{position:absolute;width:56px;height:44px;font:inherit;font-weight:bold;background:var(--err);color:#fff;border:2px solid #fff;cursor:pointer;transition:left .15s,top .15s}
.mgnums{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.mgnums button{width:70px;height:56px;font:inherit;font-size:20px;background:none;border:2px solid var(--fg);color:inherit;cursor:pointer}
body.gui .mgnums button{background:var(--face);border-color:#fff #404040 #404040 #fff;color:#000}
.mgnums button.ok{opacity:.3}
.mgres{min-height:1.5em;margin-top:8px}
#msgb{background:none;border:1px solid var(--warn);color:var(--warn);text-shadow:inherit;padding:6px 8px;text-align:left;cursor:pointer;animation:pulse2 1s infinite;flex-shrink:0}
#msgb[hidden]{display:none}
body.gui #msgb{background:#ffffe1;border:2px solid #8a4b00;color:#000}
.usfrom{opacity:.75;font-size:.85em;margin-bottom:6px}
.usbody{margin-bottom:10px}

/* ===== 1992: finestre 16 bit, stile distinto ===== */
body.e1 #crt{filter:grayscale(1) contrast(1.05)}
body.e1 .bug{border-width:2px;font-weight:bold}
body.e1 header{border:4px solid #c0c0c0;outline:1px solid #000;margin:7px 7px 0}

body.e1 header .row:first-child::before{content:"━";position:absolute;left:0;top:0;bottom:0;width:26px;background:#c0c0c0;color:#000;display:flex;align-items:center;justify-content:center;border-right:1px solid #000;font-size:11px}
body.e1 .sp{display:none}
body.e1 .hbtns{position:absolute;right:0;top:0;bottom:0;display:flex}
body.e1 .hbtns button{border:none;border-left:1px solid #000;border-radius:0;box-shadow:inset -2px -2px #808080,inset 2px 2px #fff;background:#c0c0c0;color:#000}
body.e1 .stats{background:#fff;border-bottom:1px solid #000;font-weight:bold}
body.e1 main{background:#fff;border:4px solid #c0c0c0;border-top:none;outline:1px solid #000;margin:0 7px}
body.e1 h3{color:#000;border-bottom:1px solid #000;box-shadow:none}
body.e1 .item,body.e1 .btn,body.e1 #sprintb,body.e1 .card{background:#c0c0c0;border:1px solid #000;border-radius:4px;box-shadow:inset -2px -2px #808080,inset 2px 2px #fff}
body.e1 .item:active,body.e1 .btn:active,body.e1 #sprintb:active{box-shadow:inset 2px 2px #808080}
body.e1 .item.buy,body.e1 #sprintb.ready{border:2px solid #000;background:#c0c0c0}
body.e1 .item.rel.buy{background:#ffff80}
body.e1 .item .t{font-weight:bold}

void kmain(struct boot_info *bi) {

/* mm/page.c */
void *kmalloc(size_t sz) {
    struct block *b = free_list;
    while (b && b->size < sz) b = b->next;
    if (!b) panic("out of memory");
    split_block(b, sz);
    return (void *)(b + 1);
}

/* kernel/sched.c */
void schedule(void) {
    struct task *prev = current;
    current = current->next ? current->next : task_list;
    if (prev != current)
        switch_to(prev, current);
}

/* drivers/kbd.c */
void kbd_irq(void) {
    uint8_t sc = inb(0x60);

    outb(0x20, 0x20);
}

    memcpy(p->data + 20, buf, len);
    p->seq = s->snd_nxt; s->snd_nxt += len;

  const m=pick(inst);S.bugs.push({id:Date.now()+Math.random(),t:`${pick(BUGT)} ${m.f}:${10+Math.floor(Math.random()*900)}`});
  beep(140,.12,'sawtooth',.05);log('⚠ Nuovo bug trovato!','warn');renderBugs();
  if(S.bugs.length>=bugMax())panic();
}
function fixBug(id,auto,mult=1){
  const i=S.bugs.findIndex(b=>b.id==id);if(i<0)return;
  const b=S.bugs.splice(i,1)[0];S.fixed++;
  const r=Math.max(10,bps()*4)*mult;gain(r);
  log(`${auto?'[debugger] ':''}✓ Corretto: ${b.t} (+${fmtB(r)})`);tune([660,990],60);renderBugs();
}
function renderBugs(){$('#bugs').innerHTML=S.bugs.map(b=>`<button class="bug" data-b="${b.id}">⚠ ${esc(b.t)} — TOCCA PER IL DEBUG</button>`).join('');updHeader()}
function panic(){
  paused=true;const lost=Math.floor(S.bytes*.3);S.bytes-=lost;S.bugs=[];S.panics++;S.vp++;S.eraPanics=(S.eraPanics||0)+1;if(S.y2kEnd&&Date.now()<S.y2kEnd)S.y2kPanic=true;renderBugs();

  const p=$('#panic');p.hidden=false;
  p.innerHTML=`<pre>*** KERNEL PANIC ***\n\n${esc(S.name)} ${ver()}: not syncing: troppi bug irrisolti\n\n${regs}\nEIP=0008:${hex(8)}  EFLAGS=00010246\n\nCall trace:\n [&lt;c0${hex(6)}&gt;] schedule+0x${hex(2)}/0x80\n [&lt;c0${hex(6)}&gt;] kmalloc+0x${hex(2)}/0x140\n [&lt;c0${hex(6)}&gt;] do_page_fault+0x${hex(2)}/0x2a0\n\nPersi ${fmtB(lost)} di lavoro non salvato.\nConsiglio: correggi i bug prima che arrivino a ${bugMax()}.\n\n\n        [ TOCCA PER RIAVVIARE ]</pre>`;

function refBar(rt){
  if(!S.releases||S.lastR==null)return '';
  const prev=S.lastR,tgt=Math.min(5,prev+.5),ok=rt.s>=tgt,pc=x=>(x/5*100).toFixed(1)+'%';
  const need=Math.max(.5,(tgt-.25-rt.base)/BAL.nv),miss=Math.max(0,Math.round((need-rt.nov)*10)/10);
  let msg;
  if(prev>=5&&rt.s>=5)msg='<b>Al massimo: 5 stelle come la versione precedente.</b>';
  else if(ok)msg=`<b>✔ Già meglio della versione precedente!</b>`;
  else if(need<=10)msg=`Ti mancano circa <b>${String(miss).replace('.',',')} di novità</b> (installa o migliora moduli) per superarla.`;
  else msg=`Con le sole novità non basta: <b>installa i moduli mancanti e correggi i bug</b>.`;
  return `<div class="refbar ${ok?'ok':''}"><div class="rbt">Versione precedente: ${stars(prev)} · ora previsto: ${stars(rt.s)}</div>
  <div class="rbb"><div class="rbf" style="width:${pc(rt.s)}"></div><div class="rbm ${tgt>4?'rt':''}" style="left:${pc(tgt)}"><span>da battere</span></div></div>
  <div class="rbn">${msg}</div></div>`}

      if(has('dbg')&&S.bugs.length){autoFix+=dt;if(autoFix>=15){autoFix=0;fixBug(S.bugs[0].id,true)}}

const COVCACHE={};
const COVPUB2={d:'PIXELIA',g:'FULMINE',p:'SISTEMI'};
function coverURL(id){
  if(COVCACHE[id])return COVCACHE[id];
  const c=CHAL.find(x=>x.id===id),cv=document.createElement('canvas');cv.width=64;cv.height=80;const ctx=cv.getContext('2d');const k=pxKit(ctx);
  const col=Object.assign({},COVPAL[id]);if(!col.grad)col.grad=[col.bg,col.bg];if(!col.side)col.side='#222';if(!col.top)col.top='#666';if(!col.band)col.band='#333';
  const info={n:c.n,pub:COVPUB2[c.br],y:c.y};
  COVBOX[c.e](k,info,col,a=>COVART2[id](k,a));
  return COVCACHE[id]=cv.toDataURL();
}
function coverHTML(id,cls=''){return `<img class="pxc ${cls}" src="${coverURL(id)}" alt="">`}

const chalOf=()=>S.chal&&CHAL.find(x=>x.id===S.chal.id);
function chalReqs(c){const out=Object.entries(c.req).map(([id,lv])=>({t:`${MODS.find(m=>m.id===id).n} lv.${lv}`,ok:sysLv(id)>=lv}));
  if(c.cpu!==undefined)out.push({t:`CPU ${cpuName(c.cpu)}`,ok:S.cpu>=c.cpu});
  if(c.ram!==undefined)out.push({t:`RAM ${kb(RAMS[c.ram].k)}`,ok:S.ram>=c.ram});return out}
const chalMult=c=>(1.5+.25*S.spec[c.br])*(FAMBR[fam()]===c.br?1.3:1);
function spawnChal(force){
  if(S.chal||(!force&&Math.random()>.75))return;
  const pool=CHAL.filter(c=>c.e<=era()&&c.e>=era()-1&&!S.chalDone.includes(c.id)&&!S.chalFail.includes(c.id));if(!pool.length)return;
  const cur=pool.filter(c=>c.e===era()),c=pick(cur.length?cur:pool);
  S.chal={id:c.id,until:S.major+1};S.chalNew=true;beep(1000,.06);
  log(`📰 NOTIZIA: sta per uscire ${c.n}! Tocca la notizia per vedere i requisiti.`,'warn');
}
function showChal(){
  const c=chalOf();if(!c||paused)return;const rq=chalReqs(c),b=BR[c.br];paused=true;S.chalNew=false;const o=$('#usn');o.hidden=false;beep(900,.04);
  o.innerHTML=`<div class="dlg" style="width:440px"><div class="tb">📰 Notizia · ${fmtDate(S.gdate)}</div><div class="bd"><div class="cvrow"><div class="cover">${coverHTML(c.id)}</div><div><div class="usfrom">${b.i} Sfida · ${b.n}</div><div class="usbody">Sta per uscire <b>${c.n}</b>, ${c.t}. Se al lancio ${esc(S.name)} avrà i requisiti giusti, ${b.pub} lo compreranno in massa!</div></div></div><div>${rq.map(x=>`<div class="${x.ok?'':'dim'}">${x.ok?'✔':'✘'} ${x.t}</div>`).join('')}</div><div class="dim" style="margin:8px 0">Scadenza: lancio della versione ${S.chal.until}.0 · premio: incasso x${chalMult(c).toFixed(1).replace('.',',')} e +1 livello in ${b.n}</div><div class="btns"><button class="btn sel" id="usgo">[ VAI AI MODULI ]</button><button class="btn" id="usok">[ OK ]</button></div></div></div>`;
  $('#usok').onclick=()=>{o.hidden=true;paused=!$('#panic').hidden;lastT=performance.now();refresh(true)};
  $('#usgo').onclick=()=>{$('#usok').onclick();document.querySelector('nav [data-t=mods]').click()};
}
function updNews(){const b=$('#newsb'),c=chalOf();if(!c){b.hidden=true;return}const rq=chalReqs(c);b.hidden=false;b.classList.toggle('new',!!S.chalNew);
  b.textContent=`📰 ${BR[c.br].i} ${c.n} · requisiti ${rq.filter(x=>x.ok).length}/${rq.length} · entro la v${S.chal.until}.0`}
$('#newsb').addEventListener('click',showChal);
function chalAtLaunch(){
  const c=chalOf();if(!c)return{mult:1};const rq=chalReqs(c),b=BR[c.br];
  if(rq.every(x=>x.ok)){const m=chalMult(c);S.spec[c.br]++;S.chalDone.push(c.id);S.chal=null;
    return{mult:m,rev:{m:`Fan di ${c.n}`,t:`${c.n} gira alla perfezione su ${S.name}! Lo installano tutti.`,s:5},line:`<br><span class="cvmini" style="width:48px;height:60px">${coverHTML(c.id)}</span>${b.i} <b>Sfida superata:</b> ${c.n} gira su ${esc(S.name)} e ${b.pub} lo comprano! Incasso x${m.toFixed(1).replace('.',',')} · ${b.n} livello ${S.spec[c.br]}`}}
  if(S.major>=S.chal.until){S.chalFail.push(c.id);S.chal=null;
    return{mult:1,rev:{m:`Utenti di ${c.n}`,t:`${c.n} non gira: ho dovuto cambiare sistema operativo.`,s:1.5},line:`<br>✘ Sfida mancata: ${c.n} è uscito e ${esc(S.name)} non era pronto.`}}
  return{mult:1,line:`<br>📰 ${c.n}: hai ancora una versione per soddisfare i requisiti.`};
}

  if(!saved){const lg=legacyGet();S.ngp=lg.ngp||0;S.trophies=[...(lg.trophies||[])];S.money=20*S.ngp;if(S.ngp)S.log.push({m:`⭐ Nuova partita+ ${S.ngp}: produzione +${25*S.ngp}% e ${S.money} M£ per il laboratorio.`,c:'warn'})}
  applyEra();
  if(saved){
    const raw=(Date.now()-S.last)/1000,el=Math.min(14400,raw),g=bps()*el*(has('hdd')?1:.5);
    if(g>=1){gain(g);S.log.push({m:`Bentornato! Mentre eri via il team ha scritto ${fmtB(g)}.${raw>14400?' (Disco pieno dopo 4 ore: torna più spesso!)':''}`,c:'warn'})}
    if(has('boot')&&Date.now()>=S.sprintReady)S.log.push({m:'▶ Uno sprint è pronto.',c:'dim'});

    if(has('shell'))$('#shellf').hidden=false;
    if(S.taps>=12){const h=$('#hint');h&&h.remove()}
