name: Costruisci APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Estrai il progetto (se caricato come zip)
        run: |
          if [ -f kh91-android.zip ]; then unzip -o kh91-android.zip; fi
          if [ -f index.html ]; then mkdir -p app/src/main/assets && cp index.html app/src/main/assets/index.html; fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compila
        run: gradle --no-daemon assembleDebug
      - name: Rinomina
        run: cp app/build/outputs/apk/debug/app-debug.apk KernelHacker91.apk
      - uses: actions/upload-artifact@v4
        with:
          name: KernelHacker91-apk
          path: KernelHacker91.apk
